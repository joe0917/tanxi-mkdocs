site_name: 浦陽檀溪陳氏宗譜
site_description: 浦阳檀溪陈氏宗谱谱首
docs_dir: 檀溪陈氏宗谱20260209
site_url: https://joe0917.github.io/tanxi-mkdocs/

theme:
    name: material
    locale: zh
#    language: zh   # 简体中文
    language: zh-Hant   # 繁体中文
    navigation_depth: 4
    features:
      - navigation.indexes

plugins:
    - search
    - awesome-pages:
        collapse_single_pages: true
    - ezlinks:
        wikilinks: true
    - open-in-new-tab

markdown_extensions:
    - abbr
    - admonition
    - footnotes
    - md_in_html
    - sane_lists
    - smarty
    - tables
    - toc:
        permalink: true
    - pymdownx.details
    - pymdownx.smartsymbols
    - pymdownx.highlight:
        linenums: true
    - pymdownx.arithmatex:
        generic: true
    - pymdownx.keys:
        separator: "\uff0b"
        key_map: {
                'alt': '⎇ ALt',
                'left-alt': '⎇ Left ALt',
                'right-alt': '⎇ Right ALt',
                'command': '⌘ Command',
                'left-command': '⌘ Command',
                'right-command': '⌘ Command',
                'control': '⌃Ctrl',
                'left-control': '⌃Ctrl',
                'right-control': '⌃Ctrl',
                'shift': '⇧ Shift',
                'left-shift': '⇧ Left Shift',
                'right-shift': '⇧ Right Shift',
                'windows': '⊞ Win',
                'left-windows': '⊞ Win',
                'right-windows': '⊞ Win',
                'arrow-down': '↓ Down',
                'arrow-left': '← Left',
                'arrow-right': '→ Right',
                'arrow-up': '↑ Up',
                'backspace': '⌫ Backspace',
                'backtab': '⇤ Back Tab',
                'caps-lock': '⇪ Caps Lock',
                'clear': '⌧ Clr',
                'delete': '⌦ Del',
                'end': '⤓ End',
                'escape': '⎋ Esc',
                'home': '⤒ Home',
                'page-down': '⇟ Page Down',
                'page-up': '⇞ Page Up',
                'tab': 'Tab ⇥',
                'enter': 'Enter ⏎',
                'left-button': '→🖰 Left Click',
                'right-button': '🖰← Right Click'
            }

extra_css:
  - stylesheets/extra.css
